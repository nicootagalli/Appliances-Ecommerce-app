server:
  port: 8081

spring:
  application:
    name: config-server
  cloud:
    config:
      enabled: true
      server:
        git:
          uri: https://github.com/nicootagalli/Appliances-Ecommerce-app/tree/api_gateway_test
          searchPaths: config-data
          username: ${GIT_USER}
          password: ${GIT_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka